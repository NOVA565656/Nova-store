<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schema Test</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Test Product",
      "description": "A test product description.",
      "offers": {
        "@type": "Offer",
        "price": 10.00,
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock"
      },
      "seller": {
        "@type": "Organization",
        "name": "Test Company"
      }
    }
  </script>
</head>
<body>
  <h1>Test Product</h1>
</body>
</html>
