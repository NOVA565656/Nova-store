- name: Start Production Server for Audits
        run: |
          npm run build
          npm run start & 
          npx wait-on http://localhost:3000
        env:
          SESSION_SECRET: 'test-secret-must-be-at-least-32-chars-long!!'
          APP_URL: 'http://localhost:3000'
          SUPABASE_SERVICE_ROLE_KEY: 'test-service-role-key'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun --collect.url=http://localhost:3000 --collect.numberOfRuns=1 --assert.preset=lighthouse:recommended --assert.assertions.categories:performance=0.9

      - name: Validate Schema.org
        run: |
          npx structured-data-testing-tool --url=http://localhost:3000/schema-test.html